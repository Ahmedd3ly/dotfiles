# █▀ ▀█▀ ▄▀█ █▀█ █▀ █░█ █ █▀█
# ▄█ ░█░ █▀█ █▀▄ ▄█ █▀█ █ █▀▀
#
# Why: one-line prompt "󰣇 ~ ❯" (Arch logo, path, arrow), trimmed from
# HyDE's starship.toml. Starship's built-in default ends its format with a
# line break before the arrow, which is why the path and ❯ sat on two lines.
# Right side: only the toolchains used here, command time, clock.
# Colours: Catppuccin Mocha. Ref: https://starship.rs/config/
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false        # HyDE: no blank line between prompts

format = """[󰣇 ](bold fg:#89b4fa)$directory$git_branch$git_status $character"""
right_format = """$python$dotnet$nodejs$cmd_duration$time"""

[directory]
format = "[$path](bold fg:#89dceb)[$read_only](fg:#f38ba8)"
truncate_to_repo = false
truncation_length = 4

[character]
success_symbol = "[❯](bold fg:#a6e3a1)"
error_symbol   = "[❯](bold fg:#f38ba8)"

[git_branch]
format = " [ $branch](fg:#9399b2)"

[git_status]
ahead    = '⇡${count}'
behind   = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
format   = '( [$all_status$ahead_behind](fg:#cba6f7))'

[python]
format  = " [${symbol}(${virtualenv} )${version}](fg:#f9e2af)"
symbol  = " "
version_format = "${raw}"

[dotnet]
format  = " [${symbol}${version}](fg:#b4befe)"
symbol  = "󰪮 "
version_format = "${raw}"

[nodejs]
format  = " [󰎙 ${version}](fg:#a6e3a1)"
detect_extensions = []
detect_files = ["package.json"]
version_format = "${raw}"

[cmd_duration]
min_time = 2000            # only commands slower than 2 s
format   = " [ $duration](fg:#fab387)"

[time]
disabled    = false
format      = " [ $time](fg:#a6adc8)"
time_format = "%R"
