# ======================================================================
# Mic noise suppression: RNNoise as a PipeWire filter-chain
# ======================================================================
# Why: the CH331 USB mic's noise floor measured -46.6 dB RMS in silence
# (room/fan hiss), and Vesktop has no Krisp. This adds a virtual mic,
# "Noise Canceling source", that takes the default mic through RNNoise.
# Pick it as the input device in Vesktop (or any app).
# Needs: noise-suppression-for-voice (official repo).
# nofail: if the plugin is missing, PipeWire still starts, just without
# this source.
# Recovery: delete this file, then
#   systemctl --user restart pipewire pipewire-pulse wireplumber
context.modules = [
    {   name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Noise Canceling source"
            media.name       = "Noise Canceling source"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = rnnoise
                        plugin = /usr/lib/ladspa/librnnoise_ladspa.so
                        label  = noise_suppressor_mono
                        control = {
                            # Percent voice probability needed to open the gate;
                            # raise if noise leaks through, lower if words get cut.
                            "VAD Threshold (%)"          = 50.0
                            "VAD Grace Period (ms)"      = 200
                            "Retroactive VAD Grace (ms)" = 0
                        }
                    }
                ]
            }
            capture.props = {
                node.name    = "capture.rnnoise_source"
                node.passive = true
                audio.rate   = 48000
            }
            playback.props = {
                node.name   = "rnnoise_source"
                media.class = Audio/Source
                audio.rate  = 48000
            }
        }
    }
]
