# █▀ █▀▀ █▀▀ █▀█ █▄░█ █▀▄
# ▄█ ██▄ █▄▄ █▄█ █░▀█ █▄▀
#
# Why: a second matugen run, from the wallpaper's 2nd most dominant colour,
# rendering only the end of the bar's accent gradient (dominant colour ->
# second colour, e.g. night sky -> blossoms). wall-set runs it with
# --source-color-index 1; if the image has no second colour the run fails
# and wall-set writes Catppuccin Latte mauve instead. Kept apart from
# config.toml so this run recolours nothing else.
# Relative paths resolve from this file's folder.

# Same shape as config.toml. The source colour index comes from the command
# line (--source-color-index 1), so nothing is set here.
[config]

[templates.waybar-end]
input_path = "./templates/waybar-end.css"
output_path = "../waybar/accents-end.css"
post_hook = "pkill -USR2 -x waybar || true"
