# █▀▄▀█ ▄▀█ ▀█▀ █░█ █▀▀ █▀▀ █▄░█
# █░▀░█ █▀█ ░█░ █▄█ █▄█ ██▄ █░▀█
#
# Why: wallpaper -> accent colours. matugen fills the templates in ./templates
# and writes small accent files that each app includes on top of its static
# Catppuccin Mocha neutrals. Outputs are generated, chezmoi-ignored, never
# hand-edited. wall-set (Phase 8) runs this and sets the wallpaper with awww;
# matugen itself never touches the wallpaper.
# Scheme: tonal-spot (default), dark. Every accent lands at ~9.6:1 on #1e1e2e,
# so no contrast clamp is needed (tested on boat, forest, rain_world).
# Relative paths resolve from this file's folder.
# Run by hand: matugen image <wallpaper>

[config]
# 0 = most dominant colour. Also stops v4's interactive picker, which fails
# without a terminal (rofi, scripts).
source_color_index = 0

[templates.kitty]
input_path = "./templates/kitty-accents.conf"
output_path = "../kitty/accents.conf"
post_hook = "pkill -USR1 -x kitty || true"

[templates.waybar]
input_path = "./templates/waybar-accents.css"
output_path = "../waybar/accents.css"
post_hook = "pkill -USR2 -x waybar || true"

[templates.mako]
input_path = "./templates/mako-accents"
output_path = "../mako/accents"
post_hook = "makoctl reload || true"

[templates.rofi]
input_path = "./templates/rofi-accents.rasi"
output_path = "../rofi/accents.rasi"
# no hook: rofi reads its theme every time it opens

[templates.gtk]
input_path = "./templates/gtk-accents.css"
output_path = "../gtk-3.0/accents.css"
# no hook: GTK reads it when an app starts (Thunar: thunar -q, then reopen)

[templates.hyprland]
input_path = "./templates/hypr-accents.lua"
output_path = "../hypr/modules/accents.lua"
post_hook = "hyprctl reload >/dev/null || true"

[templates.hyprlock]
input_path = "./templates/hyprlock-accents.conf"
output_path = "../hypr/hyprlock-accents.conf"
# no hook: hyprlock reads its config each time it locks
