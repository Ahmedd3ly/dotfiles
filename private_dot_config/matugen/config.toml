# █▀▄▀█ ▄▀█ ▀█▀ █░█ █▀▀ █▀▀ █▄░█
# █░▀░█ █▀█ ░█░ █▄█ █▄█ ██▄ █░▀█
#
# Why: theme + wallpaper -> every colour. matugen fills the templates in
# ./templates and writes small files per app: palette.* (the current
# theme's neutrals, from {{ theme.* }}) and accents.* (from the wallpaper).
# Waybar and hyprlock have no palette: they stay Mocha in every theme, and
# their accent templates use colors.*.dark.
# Outputs are generated, never hand-edited (seeded once by chezmoi).
# wall-set runs this with the theme's mode and palette:
#   matugen image <img> -m <light|dark> --import-json ~/.config/themes/<id>/palette.json
# and sets the wallpaper with awww; matugen itself never touches it.
# Scheme: tonal-spot (default). Dark: accents land at ~9.6:1 on Mocha base
# (tested on boat, forest, rain_world). A light theme would get tone-40
# accents; text on an accent always uses matugen's on_* role.
# No post_hooks: matugen does not run a hook only after ALL templates are
# written, so an app reading two outputs (palette + accents) could reload
# half-done (seen with mako). wall-set reloads kitty, waybar, mako and
# Hyprland once, after both matugen runs have exited.
# Relative paths resolve from this file's folder.
# Run by hand: wall-set <wallpaper>  (passes the theme flags)

[config]
# 0 = most dominant colour. Also stops v4's interactive picker, which fails
# without a terminal (rofi, scripts).
source_color_index = 0

[templates.kitty]
input_path = "./templates/kitty-accents.conf"
output_path = "../kitty/accents.conf"
# reload: wall-set, after matugen exits (see header)

[templates.waybar]
input_path = "./templates/waybar-accents.css"
output_path = "../waybar/accents.css"
# reload: wall-set, after matugen exits (see header)

[templates.mako]
input_path = "./templates/mako-accents"
output_path = "../mako/accents"
# reload: wall-set, after matugen exits (see header)

[templates.rofi]
input_path = "./templates/rofi-accents.rasi"
output_path = "../rofi/accents.rasi"
# no hook: rofi reads its theme every time it opens

[templates.gtk]
input_path = "./templates/gtk-accents.css"
output_path = "../gtk-3.0/accents.css"
# no hook: GTK reads it when an app starts (Thunar: thunar -q, then reopen)

[templates.hyprland]
input_path = "./templates/hypr-accents.lua"
output_path = "../hypr/modules/accents.lua"
# reload: wall-set, after matugen exits (see header)

[templates.hyprlock]
input_path = "./templates/hyprlock-accents.conf"
output_path = "../hypr/hyprlock-accents.conf"
# no hook: hyprlock reads its config each time it locks

# ---- Theme neutrals (theme-pick / theme-set) --------------------------------
# These read only {{ theme.* }}: the palette.json that wall-set passes with
# --import-json (~/.config/themes/<id>/). Each output is seeded once with
# Mocha by chezmoi (create_*), so apps load before the first wall-set.
# Reloads: none here; wall-set reloads every app after matugen exits.

[templates.kitty-palette]
input_path = "./templates/kitty-palette.conf"
output_path = "../kitty/palette.conf"

[templates.rofi-palette]
input_path = "./templates/rofi-palette.rasi"
output_path = "../rofi/palette.rasi"

[templates.mako-palette]
input_path = "./templates/mako-palette"
output_path = "../mako/palette"

[templates.gtk-palette]
input_path = "./templates/gtk-palette.css"
output_path = "../gtk-3.0/palette.css"

[templates.hyprtoolkit]
input_path = "./templates/hyprtoolkit.conf"
output_path = "../hypr/hyprtoolkit.conf"
# no hook: hyprtoolkit watches the file

[templates.starship]
input_path = "./templates/starship.toml"
output_path = "../starship.toml"
# no hook: starship reads its config on every prompt

[templates.hypr-palette]
input_path = "./templates/hypr-palette.lua"
output_path = "../hypr/modules/palette.lua"
# reload: wall-set (hyprctl reload)

[templates.vesktop]
input_path = "./templates/vesktop-quickcss.css"
output_path = "../vesktop/settings/quickCss.css"
# no hook: Vencord watches its QuickCSS file and reloads it live

# ---- Apps, wallpaper accents + theme neutrals ------------------------------

[templates.cava]
input_path = "./templates/cava-theme"
output_path = "../cava/themes/matugen"
# reload: wall-set (pkill -USR2 cava: colours only)

[templates.heroic]
input_path = "./templates/heroic-theme.css"
output_path = "../heroic/themes/matugen.css"
# no hook: Heroic reads it at start (see the template)

[templates.neo]
input_path = "./templates/neo-colors"
output_path = "../neo/colors"
# no hook: read when `matrix` starts
