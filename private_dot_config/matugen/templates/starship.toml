#
#
# Generated by matugen from ~/.config/matugen/templates/starship.toml
# on every wall-set; edits here are overwritten. Change the template or the
# theme's palette (~/.config/themes/<id>/palette.json) instead.
#
# Why: one-line prompt "󰣇 ~ ❯" (Arch logo, path, arrow), trimmed from
# HyDE's starship.toml. Starship's built-in default ends its format with a
# line break before the arrow, which is why the path and ❯ sat on two lines.
# Right side: only the toolchains used here, command time, clock.
# Colours: Catppuccin names from the current theme ({{ theme.name }}), in
# [palettes.theme] at the end. Starship has no include, so the whole file is
# rendered. Ref: https://starship.rs/config/
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false        # HyDE: no blank line between prompts
palette = "theme"

format = """[󰣇 ](bold fg:blue)$directory$git_branch$git_status $character"""
right_format = """$python$dotnet$nodejs$cmd_duration$time"""

[directory]
format = "[$path](bold fg:sky)[$read_only](fg:red)"
truncate_to_repo = false
truncation_length = 4

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol   = "[❯](bold fg:red)"

[git_branch]
format = " [ $branch](fg:overlay2)"

[git_status]
ahead    = '⇡${count}'
behind   = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
format   = '( [$all_status$ahead_behind](fg:mauve))'

[python]
format  = " [${symbol}(${virtualenv} )${version}](fg:yellow)"
symbol  = " "
version_format = "${raw}"

[dotnet]
format  = " [${symbol}${version}](fg:lavender)"
symbol  = "󰪮 "
version_format = "${raw}"

[nodejs]
format  = " [󰎙 ${version}](fg:green)"
detect_extensions = []
detect_files = ["package.json"]
version_format = "${raw}"

[cmd_duration]
min_time = 2000            # only commands slower than 2 s
format   = " [ $duration](fg:peach)"

[time]
disabled    = false
format      = " [ $time](fg:subtext0)"
time_format = "%R"

[palettes.theme]
blue     = "#{{ theme.blue }}"
sky      = "#{{ theme.sky }}"
red      = "#{{ theme.red }}"
green    = "#{{ theme.green }}"
overlay2 = "#{{ theme.overlay2 }}"
mauve    = "#{{ theme.mauve }}"
yellow   = "#{{ theme.yellow }}"
lavender = "#{{ theme.lavender }}"
peach    = "#{{ theme.peach }}"
subtext0 = "#{{ theme.subtext0 }}"
