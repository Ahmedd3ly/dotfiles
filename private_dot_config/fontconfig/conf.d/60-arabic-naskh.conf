<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  ======================================================================
  Arabic: Noto Naskh Arabic for sans-serif and serif
  ======================================================================
  Why: with no preference, Arabic in sans-serif falls back to Noto Kufi
  Arabic. Firefox, Vesktop (Chromium) and GTK/pango tag Arabic runs
  lang=ar and fall back per character through fontconfig.
  Only Arabic-tagged runs match the test, so Latin text is unaffected.
  The binding is strong because the generic family is strong in these
  patterns; a weak entry is outranked by other fonts that cover Arabic.
-->
<fontconfig>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Naskh Arabic</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Naskh Arabic</string>
    </edit>
  </match>
</fontconfig>
