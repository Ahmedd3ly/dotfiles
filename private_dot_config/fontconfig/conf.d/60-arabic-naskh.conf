<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  ======================================================================
  Arabic: Noto Naskh Arabic for sans-serif and serif
  ======================================================================
  Why: with no preference, Arabic in sans-serif falls back to Noto Kufi
  Arabic. Firefox, Vesktop (Chromium) and GTK/pango tag Arabic runs
  lang=ar and fall back per character through fontconfig.
  Only Arabic-tagged runs match the test, so Latin text is unaffected.
  The binding is strong because the generic family is strong in these
  patterns; a weak entry is outranked by other fonts that cover Arabic.

  Pages tagged lang=en (IPTVnator, most Electron apps) ask for Arabic
  glyphs with lang=en, so the rules above never fire and Kufi wins: it is
  the Arabic font that also covers "en", and lang outranks family.
  The scan rule adds "en" to Naskh's own language list so it ties on lang,
  and the sans-serif <default> then puts it ahead of Kufi. <default> goes
  after Noto Sans, so Latin text is unaffected.
  Scan rules live in the font cache: after chezmoi apply, and after a
  noto-fonts update, run `fc-cache -f` (see RUNBOOK.md, "Fonts").
-->
<fontconfig>
  <match target="scan">
    <test name="family"><string>Noto Naskh Arabic</string></test>
    <edit name="lang" mode="append"><langset><string>en</string></langset></edit>
  </match>
  <alias>
    <family>sans-serif</family>
    <default><family>Noto Naskh Arabic</family></default>
  </alias>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Naskh Arabic</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Naskh Arabic</string>
    </edit>
  </match>
</fontconfig>
