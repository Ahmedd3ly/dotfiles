# █▄▀ █ ▀█▀ ▀█▀ █▄█
# █░█ █ ░█░ ░█░ ░█░
#
# Why: HyDE's kitty setup (kitty.conf + hyde.conf) in one file, minus its
# theme plumbing. Colours live in theme.conf (theme neutrals + wallpaper
# accents, both from matugen). Transparency comes from Hyprland's window
# opacity (per theme: hypr/modules/look.lua) + blur, so kitty stays opaque.
# Reload after edits: ctrl+shift+F5 in kitty, or: killall -SIGUSR1 kitty
# Ref: https://sw.kovidgoyal.net/kitty/conf/

# ---- Font ---------------------------------------------------------------
# CaskaydiaCove (Cascadia Code + Nerd Font icons), as on HyDE. Package:
# ttf-cascadia-code-nerd. The bar and lock screen keep JetBrainsMono.
font_family      CaskaydiaCove Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

# ---- Window -------------------------------------------------------------
window_padding_width     25
remember_window_size     no
confirm_os_window_close  0
enable_audio_bell        no

# Cursor leaves a short trail when it jumps (animates only while moving).
cursor_trail 1

# ---- Tab bar (HyDE: bottom, slanted powerline) --------------------------
tab_bar_edge         bottom
tab_bar_style        powerline
tab_powerline_style  slanted
tab_title_template   {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# New tab opens in the current directory (kitty's default is $HOME).
map ctrl+shift+t new_tab_with_cwd

# ---- Colours ------------------------------------------------------------
include theme.conf
