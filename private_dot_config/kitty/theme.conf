# Why: kitty's colour plumbing, from HyDE's "Catppuccin Mocha" kitty.theme
# (upstream: github.com/catppuccin/kitty, MIT). Three layers, later wins:
# stock Mocha accents (fallback, below), the theme's neutrals (palette.conf),
# the wallpaper accents (accents.conf). Both included files come from matugen.

# ---- ACCENTS (fallback) ---------------------------------------------------
active_border_color     #CBA6F7
active_tab_background   #CBA6F7
selection_background    #F5E0DC
cursor                  #F5E0DC
url_color               #B4BEFE

# ---- Theme neutrals + 16 terminal colours ---------------------------------
# palette.conf: generated by matugen from the current theme (theme-pick,
# SUPER+Shift+T); seeded with Mocha by chezmoi.
include palette.conf

# ---- Wallpaper accents (matugen) -----------------------------------------
# globinclude: matches nothing (no error) until matugen has run once.
globinclude accents.conf
