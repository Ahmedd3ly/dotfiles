# █░█ █▄█ █▀█ █▀█ █░░ █▀█ █▀▀ █▄▀
# █▀█ ░█░ █▀▀ █▀▄ █▄▄ █▄█ █▄▄ █░█
#
# Why: lock screen in the stacked-clock style: big italic hours over offset
# minutes in the centre, serif italic date, light password pill, all over the
# blurred wallpaper. Greeting above the pill; keyboard layout and battery
# bottom right. No helper scripts; fonts are noto-fonts (already installed).
# Format: hyprlang (hyprlock has its own config; the Lua API is Hyprland-only).
# Ref: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
# If hyprlock ever crashes (red "lockscreen died" screen): Ctrl+Alt+F3, log in,
#   hyprctl --instance 0 dispatch 'hl.dsp.exec_cmd("hyprlock")'
# then Ctrl+Alt+F1 and unlock normally.

# COLOURS: Mocha neutrals are literals. $accent comes from the file below,
# generated by matugen from the wallpaper (seeded once by chezmoi).
source = ~/.config/hypr/hyprlock-accents.conf
$base    = rgba(1e1e2eff)
$text    = rgba(cdd6f4ff)
$subtext = rgba(bac2deff)
$fail    = rgba(f38ba8ff)
$clock   = rgba(cdd6f4e6)   # minutes: bright, slightly see-through
$hours   = rgba(a6adc8cc)   # hours: greyer and dimmer, like the reference
$pill    = rgba(cdd6f4d9)   # light password pill
$shadow  = rgba(11111b99)
$font    = JetBrainsMono Nerd Font
# Fonts: weight and slant are set with Pango markup in the label text,
# because hyprlock dropped them from font names on this machine.
$display = Noto Sans    # clock
$serif   = Noto Serif   # day + year
$month   = Noto Serif   # month (italic, larger)

general {
    hide_cursor        = true
    ignore_empty_input = true   # Enter on an empty field is not a failed attempt
}

# The current wallpaper, blurred (wall-set keeps ~/.cache/wall/current
# pointing at it). If the image can't load, the Mocha base colour shows.
background {
    monitor =
    path        = ~/.cache/wall/current
    color       = $base
    blur_passes = 3
    blur_size   = 8
}

# CLOCK: smaller, greyer hours; brighter minutes nudged right underneath.
# One size fits both monitors (hyprlock scales text with the monitor scale).
# cmd[] runs date once a second per label while locked (a few ms); $TIME
# can't be split in two.
label {
    monitor =
    text          = cmd[update:1000] echo "<span weight='heavy' style='italic'>$(date +%H)</span>"
    color         = $hours
    font_size     = 185
    font_family   = $display
    position      = -2%, 11%
    halign        = center
    valign        = center
    shadow_passes = 3
    shadow_size   = 8
    shadow_boost  = 1.6
    shadow_color  = $shadow
}
label {
    monitor =
    text          = cmd[update:1000] echo "<span weight='heavy' style='italic'>$(date +%M)</span>"
    color         = $clock
    font_size     = 210
    font_family   = $display
    position      = 2%, -2.5%
    halign        = center
    valign        = center
    shadow_passes = 2
    shadow_size   = 6
    shadow_color  = $shadow
}

# DATE: small day and year, larger italic month: 15 November, 2026
label {
    monitor =
    text          = cmd[update:60000] echo "$(date +%-d) <span font_family='$month' style='italic' size='xx-large'>$(date +%B),</span> $(date +%Y)"
    color         = $text
    font_size     = 20
    font_family   = $serif
    position      = 0, -12.5%
    halign        = center
    valign        = center
    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = $shadow
}

# GREETING: full name from the account's GECOS field (sudo chfn -f "..."),
# falling back to the login name; keeps the name out of the repo.
label {
    monitor =
    text          = cmd[update:60000] n=$(getent passwd "$USER" | cut -d: -f5 | cut -d, -f1); echo "Good $(date +%H | awk '{print ($1 < 12) ? "Morning" : ($1 < 18) ? "Afternoon" : "Evening"}'), ${n:-$USER}"
    color         = $text
    font_size     = 18
    font_family   = $font Bold
    position      = 0, 15%
    halign        = center
    valign        = bottom
    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = $shadow
}

# PASSWORD: light pill, dark text, wallpaper accent outline.
input-field {
    monitor =
    size              = 300, 55
    outline_thickness = 2
    rounding          = -1          # full pill
    dots_size         = 0.25
    dots_spacing      = 0.2
    dots_center       = true
    outer_color       = $accent
    inner_color       = $pill
    font_color        = $base
    font_family       = Noto Sans Italic
    check_color       = $accent
    fail_color        = $fail
    fade_on_empty     = false
    placeholder_text  = <i>󰌾  Enter Password...</i>
    fail_text         = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position          = 0, 8%
    halign            = center
    valign            = bottom
    shadow_passes     = 2
    shadow_size       = 6
    shadow_color      = $shadow
}

# KEYBOARD LAYOUT (us / Arabic: check before typing)
label {
    monitor =
    text        = $LAYOUT
    color       = $subtext
    font_size   = 16
    font_family = $font
    position    = -30, 30
    halign      = right
    valign      = bottom
}

# BATTERY
label {
    monitor =
    text        = cmd[update:30000] echo "󰁹 $(cat /sys/class/power_supply/BAT*/capacity)%"
    color       = $subtext
    font_size   = 16
    font_family = $font
    position    = -30, 60
    halign      = right
    valign      = bottom
}
