# █░█ █▄█ █▀█ █▀█ █░░ █▀█ █▀▀ █▄▀
# █▀█ ░█░ █▀▀ █▀▄ █▄▄ █▄█ █▄▄ █░█
#
# Why: lock screen in the stacked-clock style: equal-size italic hours over
# offset minutes, script date tucked under, light password pill, all over the
# blurred wallpaper. Weather on top; greeting above the pill; battery and
# layout bottom right.
# No helper scripts. Display font: KhatibScript v3 (~/.local/share/fonts).
# Format: hyprlang (hyprlock has its own config; the Lua API is Hyprland-only).
# Ref: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
# If hyprlock ever crashes (red "lockscreen died" screen): Ctrl+Alt+F3, log in,
#   hyprctl --instance 0 dispatch 'hl.dsp.exec_cmd("hyprlock")'
# then Ctrl+Alt+F1 and unlock normally.

# COLOURS: Mocha neutrals are literals. $accent comes from the file below,
# generated by matugen from the wallpaper (seeded once by chezmoi).
source = ~/.config/hypr/hyprlock-accents.conf
$base    = rgba(1e1e2eff)
$text    = rgba(cdd6f4ff)
$subtext = rgba(bac2deff)
$fail    = rgba(f38ba8ff)
$minutes = rgba(cdd6f4f5)   # Mocha text
$hours   = rgba(cdd6f4f5)   # same as minutes; dim it here to set the hours apart
$pill    = rgba(cdd6f4d9)
$shadow  = rgba(11111b66)   # soft, not black
$display = KhatibScript     # clock, date, greeting
$mono    = JetBrainsMono Nerd Font
$sans    = Noto Sans

general {
    hide_cursor        = true
    ignore_empty_input = true   # Enter on an empty field is not a failed attempt
}

# The current wallpaper, blurred (wall-set keeps ~/.cache/wall/current
# pointing at it). If the image can't load, the Mocha base colour shows.
background {
    monitor =
    path        = ~/.cache/wall/current
    color       = $base
    blur_passes = 3
    blur_size   = 8
}

# CLOCK STACK: positions in px (not %) so the stack keeps its shape on both
# monitors. Rows are equal size like the reference; hours sit left, minutes right.
# Row pitch 138 px ~ cap height + 10%. To change the size, scale font_size and
# every y below by the same factor.
label {
    monitor =
    text          = cmd[update:1000] date +%H
    color         = $hours
    font_size     = 200
    font_family   = $display
    position      = -40, 130
    halign        = center
    valign        = center
    shadow_passes = 2
    shadow_size   = 6
    shadow_color  = $shadow
}
label {
    monitor =
    text          = cmd[update:1000] date +%M
    color         = $minutes
    font_size     = 200
    font_family   = $display
    position      = 36, -33
    halign        = center
    valign        = center
    shadow_passes = 2
    shadow_size   = 6
    shadow_color  = $shadow
}

# DATE: small day and year, larger script month: 15 November, 2026
# y = -220 leaves ~55 px under the minutes. Tune this one number for the gap.
label {
    monitor =
    text          = cmd[update:60000] echo "$(date +%-d) <span size='155%'>$(date +%B),</span> $(date +%Y)"
    color         = $text
    font_size     = 25
    font_family   = $display
    position      = 0, -220
    halign        = center
    valign        = center
    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = $shadow
}

# GREETING: full name from the account's GECOS field (sudo chfn -f "..."),
# falling back to the login name; keeps the name out of the repo.
label {
    monitor =
    text          = cmd[update:60000] n=$(getent passwd "$USER" | cut -d: -f5 | cut -d, -f1); echo "Good $(date +%H | awk '{print ($1 < 12) ? "Morning" : ($1 < 18) ? "Afternoon" : "Evening"}'), ${n:-$USER}"
    color         = $text
    font_size     = 25
    font_family   = $display
    position      = 0, 15%
    halign        = center
    valign        = bottom
    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = $shadow
}

# WEATHER: a two-column card above the clock, read from bar-weather's cache
# (~/.cache/waybar/weather.json; the bar refreshes it every 3 h, the lock
# screen never touches the network). Left column (x = -120): temperature,
# city below. Right column (x = 90): the bar's weather icon, condition in
# words below. Positions are px from the screen centre, like the clock:
# top row y = 400, lower row y = 340. Move both rows together to keep the gap.
# weather: temperature in the display font, °C in mono. Picks the field
# with a °, so it works whether or not the bar text carries the condition.
# No '#' anywhere in a value: hyprlang starts a comment there (bar-weather
# is always metric, so °C is literal).
label {
    monitor =
    text          = cmd[update:60000] f="$HOME/.cache/waybar/weather.json"; [ -r "$f" ] && t=$(jq -r '.text | split(" | ")[0] | split(" ") | map(select(test("°"))) | first // empty' "$f") && [ -n "$t" ] && echo "${t%%°*}<span font_family='$sans'><b><i>°C</i></b></span>"
    color         = $minutes
    font_size     = 35
    font_family   = $display
    position      = -105, 400
    halign        = center
    valign        = center
    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = $shadow
}
# weather: city
label {
    monitor =
    text          = cmd[update:60000] f="$HOME/.cache/waybar/weather.json"; [ -r "$f" ] && jq -r '.text | split(" | ")[1]' "$f"
    color         = $subtext
    font_size     = 18
    font_family   = $display
    position      = -105, 340
    halign        = center
    valign        = center
    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = $shadow
}
# weather: icon (colour emoji, as in the bar)
label {
    monitor =
    text          = cmd[update:60000] f="$HOME/.cache/waybar/weather.json"; [ -r "$f" ] && jq -r '.text | split(" | ")[0] | split(" ") | map(select(length > 0)) | first' "$f"
    color         = $minutes
    font_size     = 40
    font_family   = $display
    position      = 130, 400
    halign        = center
    valign        = center
    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = $shadow
}
# weather: condition
label {
    monitor =
    text          = cmd[update:60000] f="$HOME/.cache/waybar/weather.json"; [ -r "$f" ] && jq -r '(.tooltip | capture(": (?<c>[^,]+),").c)? // empty' "$f"
    color         = $minutes
    font_size     = 18
    font_family   = $display
    position      = 130, 340
    halign        = center
    valign        = center
    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = $shadow
}

# PASSWORD: light pill, dark text, wallpaper accent outline.
input-field {
    monitor =
    size              = 320, 60
    outline_thickness = 2
    rounding          = -1          # full pill
    dots_size         = 0.25
    dots_spacing      = 0.2
    dots_center       = true
    outer_color       = $accent
    inner_color       = $pill
    font_color        = $base
    font_family       = Noto Sans Italic
    check_color       = $accent
    fail_color        = $fail
    fade_on_empty     = false
    placeholder_text  = <i>󰌾  Enter Password...</i>
    fail_text         = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position          = 0, 8%
    halign            = center
    valign            = bottom
    shadow_passes     = 2
    shadow_size       = 6
    shadow_color      = $shadow
}

# KEYBOARD LAYOUT + BATTERY: size 18, 30 px from the right and bottom edges.
# Line pitch 34 px = the old 30 px at size 16, scaled by 18/16.

# KEYBOARD LAYOUT (us / Arabic: check before typing)
label {
    monitor =
    text        = $LAYOUT
    color       = $subtext
    font_size   = 18
    font_family = $mono
    position    = -30, 30
    halign      = right
    valign      = bottom
}

# BATTERY: empty on machines without one
label {
    monitor =
    text        = cmd[update:30000] b=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1); [ -n "$b" ] && echo "󰁹 $b%"
    color       = $subtext
    font_size   = 18
    font_family = $mono
    position    = -30, 68
    halign      = right
    valign      = bottom
}
