# █░█ █▄█ █▀█ █▀█ █░░ █▀█ █▀▀ █▄▀
# █▀█ ░█░ █▀▀ █▀▄ █▄▄ █▄█ █▄▄ █░█
#
# Why: lock screen, a trimmed port of HyDE's default layout (HyDE.conf):
# time + date top right, greeting, round password field, keyboard layout and
# battery bottom right. Dropped HyDE plumbing: avatar/MPRIS art, media
# buttons, splash, helper scripts.
# Format: hyprlang (hyprlock has its own config; the Lua API is Hyprland-only).
# Ref: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
# If hyprlock ever crashes (red "lockscreen died" screen): Ctrl+Alt+F3, log in,
#   hyprctl --instance 0 dispatch 'hl.dsp.exec_cmd("hyprlock")'
# then Ctrl+Alt+F1 and unlock normally.

# COLOURS: Mocha neutrals are literals. Phase 8 swaps $accent for matugen's.
$accent  = rgba(ca9ee6ff)   # border / check
$base    = rgba(1e1e2ecc)   # field fill, slightly see-through
$text    = rgba(cdd6f4ff)
$subtext = rgba(bac2deff)
$fail    = rgba(f38ba8ff)
$font    = JetBrainsMono Nerd Font

general {
    hide_cursor        = true
    ignore_empty_input = true   # Enter on an empty field is not a failed attempt
}

# Blurred snapshot of the screen. Phase 8 points this at the current wallpaper.
background {
    monitor =
    path        = screenshot
    blur_passes = 2
    blur_size   = 7
}

# TIME
label {
    monitor =
    text        = $TIME
    color       = $text
    font_size   = 90
    font_family = $font
    position    = -30, 0
    halign      = right
    valign      = top
}

# DATE
label {
    monitor =
    text        = cmd[update:60000] date +"%A, %d %B %Y"
    color       = $subtext
    font_size   = 25
    font_family = $font
    position    = -30, -150
    halign      = right
    valign      = top
}

# GREETING
label {
    monitor =
    text        = cmd[update:60000] echo "Good $(date +%H | awk '{print ($1 < 12) ? "Morning" : ($1 < 18) ? "Afternoon" : "Evening"}'), ${USER}"
    color       = $text
    font_size   = 20
    font_family = $font Bold
    position    = 0, -16%
    halign      = center
    valign      = center
}

# PASSWORD
input-field {
    monitor =
    size              = 250, 50
    outline_thickness = 3
    rounding          = -1          # full pill
    dots_size         = 0.33
    dots_spacing      = 0.15
    dots_center       = true
    outer_color       = $accent
    inner_color       = $base
    font_color        = $text
    check_color       = $accent
    fail_color        = $fail
    fade_on_empty     = true
    placeholder_text  = <i>Password...</i>
    fail_text         = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position          = 0, 4.5%
    halign            = center
    valign            = bottom
}

# KEYBOARD LAYOUT (us / Arabic: check before typing)
label {
    monitor =
    text        = $LAYOUT
    color       = $subtext
    font_size   = 16
    font_family = $font
    position    = -30, 30
    halign      = right
    valign      = bottom
}

# BATTERY
label {
    monitor =
    text        = cmd[update:30000] echo "󰁹 $(cat /sys/class/power_supply/BAT*/capacity)%"
    color       = $subtext
    font_size   = 16
    font_family = $font
    position    = -30, 60
    halign      = right
    valign      = bottom
}
