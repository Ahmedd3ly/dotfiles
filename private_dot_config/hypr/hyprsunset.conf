# █▀ █░█ █▄░█ █▀ █▀▀ ▀█▀
# ▄█ █▄█ █░▀█ ▄█ ██▄ ░█░
#
# Why: warmer screen late at night, neutral by day. hyprsunset switches at
# each profile's time; no polling, no location lookup.
# Format: hyprlang (hyprsunset has its own config; the Lua API is Hyprland-only).
# Try values live: hyprctl hyprsunset temperature 4500 / hyprctl hyprsunset identity
# Ref: https://wiki.hypr.land/Hypr-Ecosystem/hyprsunset/

# Day: no colour change
profile {
    time     = 7:30
    identity = true
}

# Night: warm (lower = warmer; 6500 is neutral)
profile {
    time        = 23:30
    temperature = 4500
}
