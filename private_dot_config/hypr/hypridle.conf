# █░█ █▄█ █▀█ █▀█ █ █▀▄ █░░ █▀▀
# █▀█ ░█░ █▀▀ █▀▄ █ █▄▀ █▄▄ ██▄
#
# Why: idle ladder: dim -> lock -> screens off -> suspend. Video players and
# browsers playing media send idle inhibits, which are respected.
# Format: hyprlang (hypridle has its own config; the Lua API is Hyprland-only).
# Ref: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd         = pidof hyprlock || hyprlock          # what `loginctl lock-session` runs
    before_sleep_cmd = loginctl lock-session               # never wake up unlocked
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 2.5 min: dim the laptop panel (external monitor has no backlight control here)
listener {
    timeout    = 150
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# 5 min: lock
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screens off
listener {
    timeout    = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 15 min: suspend
listener {
    timeout    = 900
    on-timeout = systemctl suspend
}
