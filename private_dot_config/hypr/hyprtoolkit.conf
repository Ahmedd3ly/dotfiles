# █▀█ ░█░ █▀▀ █▀▄ ░█░ █▄█ █▄█ █▄▄ █░█ █ ░█░
#
# Why: theme for apps drawn with hyprtoolkit, the polkit password dialog
# (hyprpolkitagent 0.2) first of all. Static Catppuccin Mocha, like the other
# non-wallpaper apps. Colours are 0xAARRGGBB. hyprtoolkit watches this file.
# font_family is explicit (default "Sans Serif" left the choice to
# fontconfig); also a test for text cut with "…" at the laptop's 1.67 scale.
# Format: hyprlang. Keys: hyprtoolkit src/palette/ConfigManager.cpp.

background       = 0xFF1E1E2E   # base
base             = 0xFF181825   # mantle: fields, inputs
alternate_base   = 0xFF313244   # surface0: details box, command box
text             = 0xFFCDD6F4   # text
bright_text      = 0xFFF5E0DC   # rosewater
link_text        = 0xFF89B4FA   # blue
accent           = 0xFFCBA6F7   # mauve
accent_secondary = 0xFFB4BEFE   # lavender

font_family           = Noto Sans
font_family_monospace = JetBrainsMono Nerd Font
