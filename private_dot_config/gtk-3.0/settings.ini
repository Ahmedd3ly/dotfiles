# Fallback for GTK apps that do not read gsettings; the session values are
# set by run_onchange_after_gtk-settings.sh. Keep both in step.
# No prefer-dark here: light or dark follows the current theme through
# gsettings (theme-set), which GTK on Wayland reads first.
# gtk-theme-name is for XWayland GTK3 apps: with no XSETTINGS daemon they
# read only this file and fall back to plain Adwaita, which ignores the
# matugen palette. adw-gtk3 (not -dark) still turns dark when an app asks.
[Settings]
gtk-theme-name=adw-gtk3
gtk-icon-theme-name=Tela-circle-dracula
gtk-cursor-theme-name=Bibata-Modern-Ice
gtk-cursor-theme-size=24
